name: build
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unpack project
        run: unzip -o memscan.zip -d proj
      - name: Build root helper (NDK)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          mkdir -p proj/app/src/main/jniLibs/arm64-v8a
          "$CXX" -std=c++17 -O2 -fPIE -pie -static-libstdc++ -pthread \
            -Wl,-z,max-page-size=16384 \
            proj/helper/memhelper.cpp \
            -o proj/app/src/main/jniLibs/arm64-v8a/libmemhelper.so
          ls -l proj/app/src/main/jniLibs/arm64-v8a/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle -p proj assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: memscan-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
